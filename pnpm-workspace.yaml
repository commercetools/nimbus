    react-router: 8.3.0
    react-router-dom: 7.18.2
    react-syntax-highlighter: 16.1.1
    remark-mark-highlight: 0.1.1
    slug: 12.0.1
    vite-plugin-compression: 0.5.1
  # Data-visualization stack for @commercetools/nimbus-viz. visx = low-level
