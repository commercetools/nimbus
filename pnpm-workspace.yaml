  # Markdown rendering stack for the Markdown component (react-markdown +
  # remark plugins). Grouped here so the whole pipeline is versioned together.
  # Markdown is safe by default (no raw HTML), so no rehype-raw/rehype-sanitize;
  # custom component tags are materialized by a Nimbus-owned remark plugin.
  # Note: these are bundled into @commercetools/nimbus, not externalized —
  # see packages/nimbus/vite.config.ts.
  markdown:
    react-markdown: ^10.1.0
    remark-gfm: ^4.0.1
    remend: ^1.3.0
    remark: ^15.0.1
    remark-flexible-toc: ^1.2.6
    to-vfile: ^8.0.0
  # Private docs-app pins — not published to npm. Exact versions (no ^ or ~) so
  # Renovate updates are explicit PRs rather than silent range expansion.
  apps:
    "@huggingface/transformers": 4.2.0
    "@mdx-js/mdx": 3.1.1
    "@types/mdx": 2.0.14
    "@types/react-syntax-highlighter": 15.5.13
    "@types/slug": 5.0.9
    chokidar: 5.0.0
    fuse.js: 7.5.0
    github-slugger: 2.0.0
