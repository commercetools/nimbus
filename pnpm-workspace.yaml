packages:
  - packages/*
  - apps/*

# catalogMode set to prefer rather than strict. Strict mode requires the
# requested version to match the catalog specifier as an exact string, even
# when the specifier is a range (as nearly every entry above and in the named
# catalogs below is) that the requested version already satisfies. That exact
# equality check breaks Renovate's targeted lockfile-update command,
# `pnpm update <pkg>@<version> --recursive --lockfile-only`, which fails with
# ERR_PNPM_CATALOG_VERSION_MISMATCH for any range-pinned catalog entry. This
# is confirmed upstream pnpm behavior (pnpm/pnpm#11570, closed by #11706,
# which declined to change the underlying comparison), so it will not be
# fixed by a future pnpm release.
#
# Filed upstream: pnpm/pnpm#13715, proposing semver.satisfies for a range
# catalog entry under strict mode instead of exact string equality. When that
# lands and ships in a pnpm release, revisit switching this back to strict.
#
# Prefer mode still prefers the catalog version when compatible, but falls
# back to the requested version with a warning instead of a hard error, which
# unblocks Renovate.
catalogMode: prefer

# --- pnpm install & supply-chain settings (made explicit) ---
# pnpm 11 ships these as built-in defaults. They are pinned here so the repo's
# install behavior is visible and version-independent rather than silently
# inherited from whichever pnpm version happens to be running. Values below
# mirror pnpm 11's effective defaults, with one deliberate tightening noted on
# minimumReleaseAgeIgnoreMissingTime.

# Delay resolving newly published versions until they are at least this many
# minutes old (supply-chain protection: gives the ecosystem time to catch a
# compromised release). pnpm 11 default: 1440 (24h). Set to 0 to disable.
minimumReleaseAge: 1440
# FAIL resolution when no old-enough version satisfies a range, rather than
# falling back to a too-new one. pnpm already defaults this to `true` because
# minimumReleaseAge is set EXPLICITLY above; pinned so the guarantee survives any
# future edit to that line. Without it, pnpm silently appends a
# `minimumReleaseAgeExclude` block to this file to force the fresh version
# through, defeating the gate (this once produced a 99-entry exclude list).
# Bypasses must be hand-written and reviewed.
minimumReleaseAgeStrict: true
# FAIL resolution for packages whose registry metadata omits the `time` field,
# rather than waiving the age gate for them (pnpm's default is `true` = waive).
# Otherwise a mirror or private registry that drops `time` would silently skip
# the cooldown for every package it serves.
minimumReleaseAgeIgnoreMissingTime: false
# Fail the install if any dependency has an unreviewed build (postinstall)
# script — every builder must be an explicit decision in `allowBuilds` below.
strictDepBuilds: true
# Restrict "exotic" sources (git repos, direct tarball URLs) to direct
# dependencies only; block them as transitive subdeps.
blockExoticSubdeps: true
# Verify dependencies are present/consistent before `pnpm run` / `pnpm exec`.
verifyDepsBeforeRun: install
# Skip full re-resolution when the manifest + lockfile are unchanged.
optimisticRepeatInstall: true

# Build-script allow list. pnpm 11 removed onlyBuiltDependencies /
# neverBuiltDependencies / ignoredBuiltDependencies in favor of this single
# map: `true` = allowed to run build scripts, `false` = explicitly denied.
# Anything not listed is treated as unreviewed and (with strictDepBuilds) fails
# the install. The `true` entries were the former onlyBuiltDependencies list;
# the `false` entries were previously reported as "Ignored build scripts".
allowBuilds:
  "@bundled-es-modules/glob": true
  "@swc/core": true
  es5-ext: true
  esbuild: true
  msw: true
  style-dictionary: true
  "@fission-ai/openspec": false
  "@modelcontextprotocol/ext-apps": false
  # v2's postinstall installs deps for its own clients/* checkout subfolders —
  # a no-op when installed as a dependency. Deny per least-privilege rather
  # than relying on that no-op holding true in future releases.
  "@modelcontextprotocol/inspector": false
  core-js-pure: true
  # Transitive deps of @huggingface/transformers (docs browser semantic search).
  # The search runs entirely in a Web Worker on onnxruntime-web, so these native
  # Node build scripts are never needed at runtime — deny per least-privilege.
  onnxruntime-node: false
  protobufjs: false
  sharp: false

overrides:
  rollup: "catalog:tooling"
  "@babel/runtime": "catalog:tooling"
  prismjs: "^1.30.0"
  typescript: "catalog:tooling"
  react-aria: "catalog:react"
  react-aria-components: "catalog:react"
  react-stately: "catalog:react"
  "@react-aria/interactions": "catalog:react"
  "brace-expansion@<2": "^2.1.2"
  "brace-expansion@2": "^2.1.2"
  "brace-expansion@>=3.0.0 <5.0.7": ">=5.0.7"
  mdast-util-to-hast: "^13.2.1"
  # js-yaml 3.x security floor — >=3.15.0 fixes GHSA-h67p-54hq-rp68
  # (quadratic-complexity DoS in merge-key handling); >=3.15.1 fixes
  # GHSA-5p4m-2wfm-xmqj (quadratic CPU consumption in !!omap resolution,
  # the CVE-2026-59870 fix that was never backported to 3.x/4.x).
  # Caret holds the 3.x line — 4.x and 5.x are majors needing their own PR.
  js-yaml: "^3.15.1"
  # Force the transitively-pulled dompurify (3.4.5 via @commercetools-uikit/icons
  # + rich-text-utils) up to the vetted catalog version, clearing the dompurify
  # GHSA cluster (…-cmwh-pvxp-8882, …-rp9w-3fw7-7cwq, …-76mc-f452-cxcm, etc.).
  dompurify: "catalog:utils"
  qs: ">=6.15.2"
  # Pinned to the 3.x line, not the current v10 major: v10's CJS entry is a
  # named-exports object ({ minimatch, match, ... }), not the callable
  # `require('minimatch')(path, pattern)` default that serve-handler (via
  # @modelcontextprotocol/inspector) and other transitive <9 consumers expect.
  # 10.2.6 broke `pnpm --filter @commercetools/nimbus-mcp inspector` with
  # "TypeError: minimatch is not a function" — see git history on this line.
  "minimatch@>=3.0.0 <3.1.4": "3.1.5"
  svgo: ">=4.0.2"
  # hono >=4.12.34 clears GHSA-8j4g-w8fx-2239 (ReDoS in CORS middleware),
  # GHSA-54fx-42gc-7vw4 (algorithmic-complexity DoS in language middleware),
  # GHSA-f23p-vx2j-j53r (memo() retains SSR output across requests) and
  # GHSA-79qm-7rj5-m7r9 (proxy helper keeps Connection-listed headers).
  hono: ">=4.12.34"
  esbuild: ">=0.28.1"
  shell-quote: ">=1.9.0"
  "@babel/core": "catalog:tooling"
  # >=1.19.15 fixes GHSA-frvp-7c67-39w9 (path traversal in serve-static on
  # Windows via encoded backslash). Capped <2 deliberately: 2.x is a major
  # (raises the Node floor to >=20), and an open floor WOULD reach it —
  # 1.19.13 only survived because pnpm leaves a locked version alone while
  # it still satisfies its spec, so changing the floor forces re-resolution.
  "@hono/node-server": ">=1.19.15 <2"
  # >=4.1.2 fixes GHSA-7p8r-x3mc-p8w7 (host confusion via backslash
  # authority introducer).
  fast-uri: ">=4.1.2"
  # immutable <4.3.9 — GHSA-xvcm-6775-5m9r / GHSA-v56q-mh7h-f735 (hash-collision
  # algorithmic-complexity DoS in Immutable.Map/Set). Capped <5 to stay within 4.x.
  immutable: ">=4.3.9 <5"
  # body-parser 2.0.0–2.2.x DoS fixed in 2.3.0 (Dependabot #147). Scoped to 2.x.
  "body-parser@2": ">=2.3.0"
  # >=10.3.1 fixes three SSRF / trust-boundary bypasses:
  # GHSA-22jq-vg5j-6vgg (IPv4-mapped/NAT64 misclassification),
  # GHSA-4xrf-jv44-h6hh (CIDR suffix suppresses special-use classification)
  # and GHSA-mwp4-54f8-5fhr (leading-zero octets decoded as decimal while
  # resolvers read them as octal).
  ip-address: ">=10.3.1"
  # >=8.5.23 fixes GHSA-r28c-9q8g-f849 and GHSA-fxqj-rqcc-2cmp — path
  # traversal in previous-source-map auto-loading, where an attacker-controlled
  # sourceMappingURL discloses arbitrary .map files (the latter completes the
  # incomplete GHSA-6g55-p6wh-862q fix for the `from`-unset case).
  postcss: ">=8.5.23"
  "lodash@<4.18.0": ">=4.18.0"
  "lodash-es@<4.18.0": ">=4.18.0"
  "ajv@>=8.0.0 <8.18.0": ">=8.18.0"
  "minimatch@>=10.0.0 <10.2.3": ">=10.2.3"
  flatted: ">=3.4.2"
  # >=7.29.0 clears the 7.x advisory cluster: GHSA-4cwx-7wf7-3272 and
  # GHSA-jr45-8vmc-qm54 (cross-user disclosure via degenerate / whitespaced
  # Cache-Control directives), GHSA-8xcm-r25x-g524 (downstream response
  # desync via the retry interceptor), GHSA-v3r7-h72x-cjcm (cookie attribute
  # injection) and GHSA-m8rv-5g2x-5cg5 (CRLF injection via blob body `type`).
  # Capped <8: v8 is a major needing its own PR.
  undici: ">=7.29.0 <8"
  "picomatch@<2.3.2": ">=2.3.2"
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4"
  "yaml@1": "1.10.3"
  "yaml@2": ">=2.8.3"
  "path-to-regexp@>=8.0.0 <8.4.0": ">=8.4.0"
  "happy-dom@<20.8.9": ">=20.8.9"
  jsdom: "catalog:tooling"
  "adm-zip": ">=0.6.0"

