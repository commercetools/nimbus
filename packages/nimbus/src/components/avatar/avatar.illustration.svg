<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="il-avatar-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%))))"/>
      <stop offset="1" stop-color="var(--illustration-gradient-end, var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%)))))"/>
    </linearGradient>
    <filter id="il-avatar-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="light-dark(hsla(0, 0%, 0%, 0.1), hsla(0, 0%, 0%, 0.5))"/>
    </filter>
  </defs>
  <rect width="96" height="96" fill="url(#il-avatar-bg)"/>
  <rect x="28" y="28" width="40" height="40" rx="20" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))" filter="url(#il-avatar-shadow)"/>
  <circle cx="48" cy="43" r="6" fill="var(--nimbus-colors-color-palette-contrast, hsl(0, 0%, 100%))"/>
  <path d="M38,62 q10,-12 20,0" fill="none" stroke="var(--nimbus-colors-color-palette-contrast, hsl(0, 0%, 100%))" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="63" cy="63" r="4" fill="light-dark(var(--nimbus-colors-color-palette-1, hsl(240, 100%, 100%)), var(--nimbus-colors-color-palette-3, hsl(236, 45%, 19%)))" stroke="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))" stroke-width="1.5"/>
</svg>
