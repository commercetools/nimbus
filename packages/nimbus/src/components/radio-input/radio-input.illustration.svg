<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="il-radio-input-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%))))"/>
      <stop offset="1" stop-color="var(--illustration-gradient-end, var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%)))))"/>
    </linearGradient>
    <filter id="il-radio-input-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="light-dark(hsla(0, 0%, 0%, 0.1), hsla(0, 0%, 0%, 0.5))"/>
    </filter>
  </defs>
  <rect width="96" height="96" fill="url(#il-radio-input-bg)"/>
  <rect x="16" y="26" width="64" height="44" rx="3" fill="light-dark(var(--nimbus-colors-color-palette-1, hsl(240, 100%, 100%)), var(--nimbus-colors-color-palette-3, hsl(236, 45%, 19%)))" stroke="var(--nimbus-colors-color-palette-6, hsl(229, 100%, 88%))" stroke-width="0.5" filter="url(#il-radio-input-shadow)"/>
  <circle cx="26" cy="36" r="4" fill="none" stroke="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))" stroke-width="1"/>
  <circle cx="26" cy="36" r="2" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))"/>
  <rect x="36" y="34.5" width="28" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <circle cx="26" cy="48" r="4" fill="none" stroke="var(--nimbus-colors-color-palette-7, hsl(231, 100%, 84%))" stroke-width="1"/>
  <rect x="36" y="46.5" width="22" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-7, hsl(231, 100%, 84%))"/>
  <circle cx="26" cy="60" r="4" fill="none" stroke="var(--nimbus-colors-color-palette-7, hsl(231, 100%, 84%))" stroke-width="1"/>
  <rect x="36" y="58.5" width="26" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-7, hsl(231, 100%, 84%))"/>
</svg>
