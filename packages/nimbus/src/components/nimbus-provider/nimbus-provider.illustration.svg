<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="il-nimbus-provider-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%))))"/>
      <stop offset="1" stop-color="var(--illustration-gradient-end, var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%)))))"/>
    </linearGradient>
    <filter id="il-nimbus-provider-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="light-dark(hsla(0, 0%, 0%, 0.1), hsla(0, 0%, 0%, 0.5))"/>
    </filter>
  </defs>
  <rect width="96" height="96" fill="url(#il-nimbus-provider-bg)"/>
  <rect x="12" y="16" width="72" height="64" rx="3" fill="light-dark(var(--nimbus-colors-color-palette-1, hsl(240, 100%, 100%)), var(--nimbus-colors-color-palette-3, hsl(236, 45%, 19%)))" stroke="var(--nimbus-colors-color-palette-6, hsl(229, 100%, 88%))" stroke-width="0.5" filter="url(#il-nimbus-provider-shadow)"/>
  <rect x="20" y="24" width="24" height="10" rx="2" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))"/>
  <rect x="26" y="27.5" width="12" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-contrast, hsl(0, 0%, 100%))"/>
  <rect x="52" y="25" width="16" height="8" rx="4" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))"/>
  <circle cx="64" cy="29" r="2.5" fill="var(--nimbus-colors-color-palette-contrast, hsl(0, 0%, 100%))"/>
  <rect x="20" y="40" width="56" height="10" rx="2" fill="light-dark(var(--nimbus-colors-color-palette-1, hsl(240, 100%, 100%)), var(--nimbus-colors-color-palette-3, hsl(236, 45%, 19%)))" stroke="var(--nimbus-colors-color-palette-6, hsl(229, 100%, 88%))" stroke-width="0.5" filter="url(#il-nimbus-provider-shadow)"/>
  <rect x="25" y="43.5" width="19" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-7, hsl(231, 100%, 84%))"/>
  <circle cx="28" cy="66" r="4" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))"/>
  <circle cx="40" cy="66" r="4" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <circle cx="52" cy="66" r="4" fill="var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%))"/>
  <rect x="62" y="64.5" width="14" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-7, hsl(231, 100%, 84%))"/>
</svg>
