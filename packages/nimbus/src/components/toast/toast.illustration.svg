<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="il-toast-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%))))"/>
      <stop offset="1" stop-color="var(--illustration-gradient-end, var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%)))))"/>
    </linearGradient>
    <filter id="il-toast-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="light-dark(hsla(0, 0%, 0%, 0.1), hsla(0, 0%, 0%, 0.5))"/>
    </filter>
  </defs>
  <rect width="96" height="96" fill="url(#il-toast-bg)"/>
  <rect x="24" y="32" width="52" height="18" rx="2" fill="var(--nimbus-colors-color-palette-6, hsl(229, 100%, 88%))"/>
  <rect x="16" y="44" width="60" height="20" rx="2" fill="light-dark(var(--nimbus-colors-color-palette-1, hsl(240, 100%, 100%)), var(--nimbus-colors-color-palette-3, hsl(236, 45%, 19%)))" stroke="var(--nimbus-colors-color-palette-6, hsl(229, 100%, 88%))" stroke-width="0.5" filter="url(#il-toast-shadow)"/>
  <circle cx="28" cy="54" r="4" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))"/>
  <path d="M26.6,54 l0.98,0.98 l1.82,-1.96" fill="none" stroke="var(--nimbus-colors-color-palette-contrast, hsl(0, 0%, 100%))" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="50" width="24" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <rect x="40" y="56" width="16" height="2.5" rx="1.25" fill="var(--nimbus-colors-color-palette-7, hsl(231, 100%, 84%))"/>
  <path d="M66.6,52.6 l2.8,2.8 m-2.8,0 l2.8,-2.8" fill="none" stroke="light-dark(var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%)), var(--nimbus-colors-color-palette-11, hsl(231, 100%, 81%)))" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
