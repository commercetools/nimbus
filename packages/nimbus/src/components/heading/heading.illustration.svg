<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="il-heading-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%))))"/>
      <stop offset="1" stop-color="var(--illustration-gradient-end, var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%)))))"/>
    </linearGradient>
    <filter id="il-heading-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="light-dark(hsla(0, 0%, 0%, 0.1), hsla(0, 0%, 0%, 0.5))"/>
    </filter>
  </defs>
  <rect width="96" height="96" fill="url(#il-heading-bg)"/>
  <rect x="16" y="30" width="44" height="6" rx="3" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <rect x="16" y="44" width="64" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <rect x="16" y="52" width="56" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <rect x="16" y="60" width="40" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
</svg>
