<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="il-menu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%))))"/>
      <stop offset="1" stop-color="var(--illustration-gradient-end, var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%)))))"/>
    </linearGradient>
    <filter id="il-menu-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="light-dark(hsla(0, 0%, 0%, 0.1), hsla(0, 0%, 0%, 0.5))"/>
    </filter>
  </defs>
  <rect width="96" height="96" fill="url(#il-menu-bg)"/>
  <rect x="24" y="20" width="28" height="12" rx="2" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))" filter="url(#il-menu-shadow)"/>
  <rect x="30" y="24.5" width="10" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-contrast, hsl(0, 0%, 100%))"/>
  <path d="M44,25 l2,2 l2,-2" fill="none" stroke="var(--nimbus-colors-color-palette-contrast, hsl(0, 0%, 100%))" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="36" width="48" height="40" rx="2" fill="light-dark(var(--nimbus-colors-color-palette-1, hsl(240, 100%, 100%)), var(--nimbus-colors-color-palette-3, hsl(236, 45%, 19%)))" stroke="var(--nimbus-colors-color-palette-6, hsl(229, 100%, 88%))" stroke-width="0.5" filter="url(#il-menu-shadow)"/>
  <rect x="26" y="38" width="44" height="10" rx="1" fill="var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%))"/>
  <rect x="31" y="41.5" width="20" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <rect x="31" y="52.5" width="24" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-7, hsl(231, 100%, 84%))"/>
  <line x1="28" y1="59" x2="68" y2="59" stroke="var(--nimbus-colors-color-palette-5, hsl(229, 100%, 92%))" stroke-width="0.5"/>
  <rect x="31" y="64" width="18" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-7, hsl(231, 100%, 84%))"/>
</svg>
