<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="il-list-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%))))"/>
      <stop offset="1" stop-color="var(--illustration-gradient-end, var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%)))))"/>
    </linearGradient>
    <filter id="il-list-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="light-dark(hsla(0, 0%, 0%, 0.1), hsla(0, 0%, 0%, 0.5))"/>
    </filter>
  </defs>
  <rect width="96" height="96" fill="url(#il-list-bg)"/>
  <circle cx="22" cy="30" r="2" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))"/>
  <rect x="30" y="28.5" width="40" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <circle cx="22" cy="42" r="2" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))"/>
  <rect x="30" y="40.5" width="48" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <circle cx="22" cy="54" r="2" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))"/>
  <rect x="30" y="52.5" width="36" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <circle cx="22" cy="66" r="2" fill="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))"/>
  <rect x="30" y="64.5" width="44" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
</svg>
