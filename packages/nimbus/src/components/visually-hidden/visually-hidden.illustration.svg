  <path d="M25.5,46 Q29,41.5 32.5,46 Q29,50.5 25.5,46 Z" fill="none" stroke="light-dark(var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%)), var(--nimbus-colors-color-palette-11, hsl(231, 100%, 81%)))" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/>
