<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="il-password-input-field-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%))))"/>
      <stop offset="1" stop-color="var(--illustration-gradient-end, var(--illustration-gradient-start, light-dark(var(--nimbus-colors-color-palette-4, hsl(228, 100%, 94%)), var(--nimbus-colors-color-palette-2, hsl(233, 41%, 9%)))))"/>
    </linearGradient>
    <filter id="il-password-input-field-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="light-dark(hsla(0, 0%, 0%, 0.1), hsla(0, 0%, 0%, 0.5))"/>
    </filter>
  </defs>
  <rect width="96" height="96" fill="url(#il-password-input-field-bg)"/>
  <rect x="16" y="30" width="24" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <rect x="16" y="38" width="64" height="16" rx="2" fill="light-dark(var(--nimbus-colors-color-palette-1, hsl(240, 100%, 100%)), var(--nimbus-colors-color-palette-3, hsl(236, 45%, 19%)))" stroke="var(--nimbus-colors-color-palette-6, hsl(229, 100%, 88%))" stroke-width="0.5" filter="url(#il-password-input-field-shadow)"/>
  <circle cx="24" cy="46" r="1.3" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <circle cx="30" cy="46" r="1.3" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <circle cx="36" cy="46" r="1.3" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <circle cx="42" cy="46" r="1.3" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <circle cx="48" cy="46" r="1.3" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
  <path d="M67.5,46 Q71,41.5 74.5,46 Q71,50.5 67.5,46 Z" fill="none" stroke="light-dark(var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%)), var(--nimbus-colors-color-palette-11, hsl(231, 100%, 81%)))" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="71" cy="46" r="0.9" fill="light-dark(var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%)), var(--nimbus-colors-color-palette-11, hsl(231, 100%, 81%)))"/>
  <rect x="16" y="60" width="36" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
