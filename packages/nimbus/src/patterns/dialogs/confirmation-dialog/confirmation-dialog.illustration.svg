  <path d="M32,34 L36.5,42 H27.5 Z M32,37 v2 M32,40.4 h0.01" fill="none" stroke="var(--nimbus-colors-color-palette-9, hsl(240, 64%, 58%))" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="36.5" width="20" height="3" rx="1.5" fill="var(--nimbus-colors-color-palette-8, hsl(232, 88%, 77%))"/>
