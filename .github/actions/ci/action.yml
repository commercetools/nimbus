name: CI

description: Shared action with basic setup for each job

runs:
  using: composite

  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "24"
        cache: pnpm

    # Pinned to v11: npm@12 broke `npm info --json` for older changesets and
    # ships a broken sigstore dep. Keep in sync with release.yml.
    - name: Update npm
      run: npm install -g npm@11
      shell: bash

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Building packages
      # Skip full docs build (Vite app) - Vercel handles that separately
      # But generate docs data so MCP tools have component metadata
      run: pnpm build:tokens && pnpm build:packages && pnpm build:docs-data && pnpm build:mcp
      shell: bash
