name: Deploy Contextual AI Prototype

on:
  push:
    branches: [bw/contextual-ai-prototype]
    paths:
      - 'apps/contextual-ai-prototype/**'
      - 'packages/nimbus/**'
      - 'packages/nimbus-viz/**'
      - 'packages/nimbus-icons/**'
      - 'packages/tokens/**'
      - '.github/workflows/deploy-prototype.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and build
        uses: ./.github/actions/ci

      - name: Build prototype
        run: pnpm --filter contextual-ai-prototype build
        env:
          GITHUB_PAGES: "1"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/contextual-ai-prototype/dist
