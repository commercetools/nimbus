name: Deploy Contextual AI Prototype

on:
  push:
    branches: [bw/contextual-ai-prototype]
    paths:
      - 'apps/contextual-ai-prototype/**'
      - 'packages/nimbus/**'
      - 'packages/nimbus-viz/**'
      - 'packages/nimbus-icons/**'
      - 'packages/tokens/**'
      - '.github/workflows/deploy-prototype.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and build
        uses: ./.github/actions/ci

      - name: Build prototype
        run: pnpm --filter contextual-ai-prototype build
        env:
          GITHUB_PAGES: "1"

      - name: Deploy to gh-pages branch
        run: |
          cd apps/contextual-ai-prototype/dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: contextual-ai-prototype $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
