name: Deploy Contextual AI Prototype

on:
  push:
    branches: [bw/contextual-ai-prototype]
    paths:
      - 'apps/contextual-ai-prototype/**'
      - 'packages/nimbus/**'
      - 'packages/nimbus-viz/**'
      - 'packages/nimbus-icons/**'
      - 'packages/tokens/**'
      - '.github/workflows/deploy-prototype.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and build
        uses: ./.github/actions/ci

      - name: Build prototype
        run: pnpm --filter contextual-ai-prototype build
        env:
          GITHUB_PAGES: "1"

      - name: Deploy to gh-pages subdirectory
        run: |
          git fetch origin gh-pages:gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages
          rm -rf multi-surface-rendering-user-journeys
          cp -r apps/contextual-ai-prototype/dist multi-surface-rendering-user-journeys
          git add multi-surface-rendering-user-journeys
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: multi-surface-rendering-user-journeys $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty
          git push origin gh-pages
