name: Deploy Agent Registry Mock to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/agent-registry-mock/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build agent-registry-mock
        run: pnpm --filter @commercetools-local/agent-registry-mock build
        env:
          PAGES_BASE: /nimbus/agent-registry/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/agent-registry-mock/dist
          destination_dir: agent-registry
          keep_files: true
