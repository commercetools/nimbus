name: Release

on:
  push:
    branches:
      - main
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Get GitHub token via the CT Changesets App
      - name: Generate GitHub token (via CT Changesets App)
        id: generate_github_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.CT_CHANGESETS_APP_ID }}
          private_key: ${{ secrets.CT_CHANGESETS_APP_PEM }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pass a personal access token (using our `ct-changesets` app) to be able to trigger other workflows
          # https://help.github.com/en/actions/reference/events-that-trigger-workflows#triggering-new-workflows-using-a-personal-access-token
          # https://github.community/t/action-does-not-trigger-another-on-push-tag-action/17148/8
          token: ${{ steps.generate_github_token.outputs.token }}

      # Ensure we are using valid node version for npm trusted publising AFTER checkout
      # https://docs.npmjs.com/trusted-publishers#github-actions-configuration
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Ensure npm >=11.5.1 for OIDC support (npm@12 has a broken sigstore dependency)
      - name: Update npm
        run: npm install -g npm@11

      - name: Verify npm version
        run: npm --version

      - name: Installing dependencies and building packages
        uses: ./.github/actions/ci

      # Configure npm registry for trusted publishing (OIDC)
      # This must run AFTER the CI action to override the Node setup with registry config
      # https://docs.npmjs.com/trusted-publishers#github-actions-configuration
      - name: Setup npm registry for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # v2 of this action is required by @changesets/cli v3. v1 detected which
      # packages were published by scraping "New tag: <pkg>@<version>" lines out
      # of the publish output; v3 no longer prints them, so v1 saw zero packages
      # and silently skipped pushing tags and creating releases. v2 reads the
      # structured file named by CHANGESETS_OUTPUT, which it passes down to the
      # scripts below. Inputs were also renamed to kebab-case in v2, and a
      # custom token must now arrive through the `github-token` input -- the
      # GITHUB_TOKEN environment variable is no longer a substitute.
      - name: Creating release pull request or publishing release to npm registry
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.generate_github_token.outputs.token }}
          publish-script: pnpm changeset publish
          version-script: pnpm changeset:version-and-format
          commit-message: "ci(changesets): version packages"
          pr-title: "ci(changesets): version packages"
          create-github-releases: true
        env:
          SKIP_POSTINSTALL_DEV_SETUP: true

      # 3.6.0 shipped to npm with no git tags and no GitHub releases, and this
      # job still reported the publish step as successful, because the action
      # could not read the CLI's output and concluded nothing had been
      # published. Assert the invariant directly rather than trusting the
      # action's own report: whatever version is on npm must have a git tag.
      # Skipping when the version is absent from npm keeps ordinary pushes and
      # the version-PR run quiet -- it only fires on a real inconsistency.
      - name: Verify the published version is tagged
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/nimbus/package.json').version")
          TAG="@commercetools/nimbus@${VERSION}"

          if ! npm view "$TAG" version >/dev/null 2>&1; then
            echo "$TAG is not on npm - nothing to verify."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "OK: $TAG is on npm and tagged in git."
            exit 0
          fi

          echo "::error::${VERSION} is published on npm but the git tag ${TAG} is missing, so no GitHub release exists for it. The publish step reported success without creating tags -- check that the changesets/action and @changesets/cli major versions are still compatible."
          exit 1

      # Publish canary releases only if the packages weren't published already
      - name: Regenerate GitHub token for canary
        if: steps.changesets.outputs.published != 'true' && github.ref ==
          'refs/heads/main'
        id: generate_github_token_canary
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.CT_CHANGESETS_APP_ID }}
          private_key: ${{ secrets.CT_CHANGESETS_APP_PEM }}

      - name: Publishing canary releases to npm registry
        if: steps.changesets.outputs.published != 'true' && github.ref ==
          'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          # @changesets/cli v3 exits 1 when there are no unreleased changesets
          # (changesets/changesets#1860); v2 exited 0 silently. Right after a
          # release the directory is empty, so check here instead of letting the
          # CLI fail the job.
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "No pending changesets - nothing to publish as a canary."
            exit 0
          fi
          pnpm changeset version --snapshot canary
          pnpm changeset publish --tag canary
        env:
          GITHUB_TOKEN: ${{ steps.generate_github_token_canary.outputs.token }}

  canary-from-pr:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '[/deploy-canary]')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get PR branch
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const branch = pr.data.head.ref;
            const sanitized = branch.replace(/[^a-zA-Z0-9-]/g, '-').slice(0, 40);
            core.setOutput('ref', branch);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('tag', sanitized);

      - name: React to comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@11

      - name: Install and build
        uses: ./.github/actions/ci

      - name: Setup npm registry for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Generate GitHub token
        id: generate_github_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.CT_CHANGESETS_APP_ID }}
          private_key: ${{ secrets.CT_CHANGESETS_APP_PEM }}

      - name: Publish canary snapshot
        id: publish
        run: |
          set -euo pipefail
          SNAPSHOT_TAG="canary-${{ steps.pr.outputs.tag }}"
          # See the note on the main canary step: v3 exits 1 with no changesets.
          # Fail with an actionable message rather than the CLI's bare error.
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "::error::This PR has no changeset, so there is nothing to publish as a canary. Add one with 'pnpm changeset'."
            exit 1
          fi
          pnpm changeset version --snapshot "$SNAPSHOT_TAG"
          pnpm changeset publish --tag canary 2>&1 | tee /tmp/publish-output.txt

          VERSION=$(grep -oP '@commercetools/nimbus@\K[^\s]+' /tmp/publish-output.txt | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ steps.generate_github_token.outputs.token }}

      - name: Comment with install instructions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const version = '${{ steps.publish.outputs.version }}';
            const sha = '${{ steps.pr.outputs.sha }}'.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `### 🚀 Canary published`,
                '',
                `**Version:** \`${version}\``,
                `**Commit:** \`${sha}\``,
                '',
                '```bash',
                `pnpm add @commercetools/nimbus@${version}`,
                `pnpm add @commercetools/nimbus-tokens@${version}`,
                `pnpm add @commercetools/nimbus-icons@${version}`,
                `pnpm add @commercetools/nimbus-theme-generator@${version}`,
                '```',
              ].join('\n'),
            });
