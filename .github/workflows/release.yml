name: Release

# Pushes to main release. A push to any other branch publishes a PR canary only
# when its head commit message contains [publish-preview]; otherwise every job is
# skipped. npm trusted publishing (OIDC) rejects publishes from issue_comment
# runs, which is why canaries start from a push instead of a PR comment.
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if:
      github.event_name == 'workflow_dispatch' || github.ref ==
      'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      # Get GitHub token via the CT Changesets App
      - name: Generate GitHub token (via CT Changesets App)
        id: generate_github_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.CT_CHANGESETS_APP_ID }}
          private_key: ${{ secrets.CT_CHANGESETS_APP_PEM }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pass a personal access token (using our `ct-changesets` app) to be able to trigger other workflows
          # https://help.github.com/en/actions/reference/events-that-trigger-workflows#triggering-new-workflows-using-a-personal-access-token
          # https://github.community/t/action-does-not-trigger-another-on-push-tag-action/17148/8
          token: ${{ steps.generate_github_token.outputs.token }}

      # Ensure we are using valid node version for npm trusted publising AFTER checkout
      # https://docs.npmjs.com/trusted-publishers#github-actions-configuration
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      # Ensure npm >=11.5.1 for OIDC support (npm@12 has a broken sigstore dependency)
      - name: Update npm
        run: npm install -g npm@11

      - name: Verify npm version
        run: npm --version

      - name: Installing dependencies and building packages
        uses: ./.github/actions/ci

      # Configure npm registry for trusted publishing (OIDC)
      # This must run AFTER the CI action to override the Node setup with registry config
      # https://docs.npmjs.com/trusted-publishers#github-actions-configuration
      - name: Setup npm registry for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      # Keep this action's major version in step with @changesets/cli's: v1
      # cannot read v3's publish output and silently skips tags and releases.
      - name:
          Creating release pull request or publishing release to npm registry
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.generate_github_token.outputs.token }}
          publish-script: pnpm changeset publish
          version-script: pnpm changeset:version-and-format
          commit-message: "ci(changesets): version packages"
          pr-title: "ci(changesets): version packages"
          create-github-releases: true
        env:
          SKIP_POSTINSTALL_DEV_SETUP: true

      # Derived independently of the step above, which has reported success
      # while creating no tags at all.
      - name: Verify the published version is tagged
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/nimbus/package.json').version")
          TAG="@commercetools/nimbus@${VERSION}"

          if ! npm view "$TAG" version >/dev/null 2>&1; then
            echo "$TAG is not on npm - nothing to verify."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "OK: $TAG is on npm and tagged in git."
            exit 0
          fi

          echo "::error::${VERSION} is published on npm but the git tag ${TAG} is missing, so no GitHub release exists for it. The publish step reported success without creating tags -- check that the changesets/action and @changesets/cli major versions are still compatible."
          exit 1

      # Publish canary releases only if the packages weren't published already
      - name: Regenerate GitHub token for canary
        if:
          steps.changesets.outputs.published != 'true' && github.ref ==
          'refs/heads/main'
        id: generate_github_token_canary
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.CT_CHANGESETS_APP_ID }}
          private_key: ${{ secrets.CT_CHANGESETS_APP_PEM }}

      - name: Publishing canary releases to npm registry
        if:
          steps.changesets.outputs.published != 'true' && github.ref ==
          'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          # @changesets/cli v3 exits 1 when there are no unreleased changesets
          # (changesets/changesets#1860), the normal state right after a release.
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "No pending changesets - nothing to publish as a canary."
            exit 0
          fi
          pnpm changeset version --snapshot canary
          pnpm changeset publish --tag canary
        env:
          GITHUB_TOKEN: ${{ steps.generate_github_token_canary.outputs.token }}

  canary-from-pr:
    if: >
      github.event_name == 'push' && github.ref != 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[publish-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: canary-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@11

      - name: Install and build
        uses: ./.github/actions/ci

      - name: Setup npm registry for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - name: Generate GitHub token
        id: generate_github_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.CT_CHANGESETS_APP_ID }}
          private_key: ${{ secrets.CT_CHANGESETS_APP_PEM }}

      - name: Publish canary snapshot
        id: publish
        run: |
          set -euo pipefail
          # Branch names reach the shell through env, never through ${{ }}.
          SNAPSHOT_TAG="canary-$(printf '%s' "$BRANCH" | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-40)"
          # v3 exits 1 with no changesets; say why rather than leaking that.
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "::error::This branch has no changeset, so there is nothing to publish as a canary. Add one with 'pnpm changeset'."
            exit 1
          fi
          pnpm changeset version --snapshot "$SNAPSHOT_TAG"
          pnpm changeset publish --tag canary 2>&1 | tee "$RUNNER_TEMP/publish-output.txt"

          VERSION=$(grep -oP '@commercetools/nimbus@\K[^\s]+' "$RUNNER_TEMP/publish-output.txt" | head -1 || true)
          if [ -z "$VERSION" ]; then
            echo "::error::No @commercetools/nimbus version found in the publish output, so no canary was published."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ steps.generate_github_token.outputs.token }}

      - name: Comment with install instructions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${context.ref.replace('refs/heads/', '')}`,
            });
            if (prs.length === 0) {
              core.warning('Canary published, but no open PR exists for this branch to comment on.');
              return;
            }
            const version = process.env.VERSION;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prs[0].number,
              body: [
                `### 🚀 Canary published`,
                '',
                `**Version:** \`${version}\``,
                `**Commit:** \`${context.sha.slice(0, 7)}\``,
                '',
                '```bash',
                `pnpm add @commercetools/nimbus@${version}`,
                `pnpm add @commercetools/nimbus-tokens@${version}`,
                `pnpm add @commercetools/nimbus-icons@${version}`,
                `pnpm add @commercetools/nimbus-theme-generator@${version}`,
                '```',
              ].join('\n'),
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${context.ref.replace('refs/heads/', '')}`,
            });
            if (prs.length === 0) return;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prs[0].number,
              body: `### ❌ Canary publish failed\n\nCommit \`${context.sha.slice(0, 7)}\`. See the [workflow run](${runUrl}).`,
            });
