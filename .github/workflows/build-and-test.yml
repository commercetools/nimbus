name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    container:
      # Must track the `playwright` version in pnpm-workspace.yaml's tooling
      # catalog. The image ships pre-downloaded browsers under a build-specific
      # revision directory, so a Playwright bump that changes that revision
      # fails at launch with "Executable doesn't exist at
      # /ms-playwright/chromium_headless_shell-<rev>". Bump both together.
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installing dependencies and building packages
        uses: ./.github/actions/ci

      - name: Bundle size check
        if: github.event_name == 'pull_request' && vars.BUNDLE_SIZE_ENABLED != 'false'
        uses: ./.github/actions/bundle-size
        with:
          gh-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Validate OpenSpec proposals
        run: pnpm openspec validate --all --strict

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck:strict

      - name: Check package shape
        run: pnpm check:package-shape

      - name: Clean temp before tests
        run: rm -rf /tmp/* || true
        shell: bash

      - name: Run tests
        run: pnpm test
        timeout-minutes: 10
