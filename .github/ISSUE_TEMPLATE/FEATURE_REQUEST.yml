name: 🚀 Feature Proposal
description: Propose a new component, variant, or capability for Nimbus.
title: "[Feature]: <title>"
labels: ["Type: New Feature", "Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please search open/closed issues and discussions — someone may have proposed something similar.

        Not sure if this belongs in Nimbus? Start with a conversation in [#ask-nimbus-anything](https://commercetools.slack.com/archives/C0ACFBKAHTM) or a [GitHub discussion](https://github.com/commercetools/nimbus/discussions) first.
  - type: checkboxes
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues and discussions.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What are you trying to accomplish? What's the gap in Nimbus today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use cases
      description: Where does this come up? In which products, features, or workflows?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Who benefits
      description: Which teams or products would use this if it existed?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: |
        What should the component or variant do? Sketches, mockups, or pseudocode are welcome but not required.

        Tip: You can attach images by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        **For internal requests**, please also fill in the fields below:
  - type: input
    attributes:
      label: Champion
      description: Who will be the primary contact for this request?
      placeholder: e.g. name / team
    validations:
      required: false
  - type: textarea
    attributes:
      label: Stakeholders
      description: List individuals or teams who will be impacted or should be involved.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Required components
      description: Describe any dependencies on other Nimbus components and how they interact (in code and/or design).
    validations:
      required: false
