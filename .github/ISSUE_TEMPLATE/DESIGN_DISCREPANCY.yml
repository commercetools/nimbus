name: 🎨 Design Discrepancy
description: Report a mismatch between the Figma library and coded components.
title: "[Design Discrepancy]: <title>"
labels: ["Type: Design Discrepancy", "Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template when the Figma library and the coded component library are out of sync — a variant exists in one but not the other, a prop has no Figma equivalent, or a designer's mockup diverges from the coded component in subtle ways.
  - type: input
    id: component
    attributes:
      label: Component
      description: Which Nimbus component is affected?
      placeholder: e.g. Button, Alert, DataTable
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: What differs
      description: Describe the mismatch between Figma and code. Which side has the expected behavior?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: |
        Screenshots showing the difference between Figma and coded component.

        Tip: You can attach images by clicking this area to highlight it and then dragging files in.
    validations:
      required: true
  - type: input
    id: figma-link
    attributes:
      label: Figma link
      description: Link to the relevant Figma component or frame.
      placeholder: https://www.figma.com/design/...
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Any other context — e.g. which product surfaced this, whether it's blocking work.
    validations:
      required: false
